<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发布信息</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="header"><h1>发布信息</h1></div>

  <form id="form" class="form">
    <div class="form-group">
      <label>物品类型</label>
      <select id="type">
        <option value="lost">寻物（我丢了东西）</option>
        <option value="found">招领（我捡到东西）</option>
      </select>
    </div>
    <div class="form-group">
      <label>物品名称 <span style="color:#f5222d">*</span></label>
      <input id="title" placeholder="如：校园一卡通 / 白色耳机" maxlength="30">
    </div>
    <div class="form-group">
      <label>物品分类 <span style="color:#f5222d">*</span></label>
      <select id="category">
        <option value="">请选择</option>
        <option>证件卡类</option><option>数码产品</option><option>钥匙</option>
        <option>生活用品</option><option>书籍</option><option>其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>丢失/拾取地点 <span style="color:#f5222d">*</span></label>
      <input id="location" placeholder="如：图书馆三楼自习区">
    </div>
    <div class="form-group">
      <label>时间 <span style="color:#f5222d">*</span></label>
      <input id="time" type="date">
    </div>
    <div class="form-group">
      <label>详细描述</label>
      <textarea id="description" placeholder="描述物品的颜色、品牌、特征"></textarea>
    </div>
    <div class="form-group">
      <label>联系方式 <span style="color:#f5222d">*</span></label>
      <input id="contact" placeholder="QQ / 微信 / 手机号">
    </div>
    <div class="form-group">
      <label>发布者昵称</label>
      <input id="publisher" placeholder="如：王同学（可留空）">
    </div>
    <div id="error" class="error"></div>
    <button type="submit" class="btn block">发布</button>
  </form>

  <nav class="tabbar">
    <a href="index.html"><span class="icon">🏠</span>首页</a>
    <a href="publish.html" class="active"><span class="icon">➕</span>发布</a>
    <a href="my.html"><span class="icon">👤</span>我的</a>
  </nav>
</div>

<script src="js/storage.js"></script>
<script src="js/validate.js"></script>
<script src="js/publish.js"></script>
</body>
</html>
